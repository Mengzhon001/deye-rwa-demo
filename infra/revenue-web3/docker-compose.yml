name: deye-rwa-platform

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.3
    platform: ${DEYE_DOCKER_PLATFORM:-linux/arm64}
    # The image defaults to UID 1000 while a fresh named volume is root-owned.
    # Root is limited to this disposable local node container and is required so
    # Anvil can atomically persist its state file across container recreation.
    user: "0:0"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["sh", "-c"]
    command:
      - 'if [ -s /data/state.json ]; then exec anvil --host 0.0.0.0 --port 8545 --chain-id 20260922 --gas-limit 30000000 --mnemonic "$${ANVIL_MNEMONIC}" --load-state /data/state.json --dump-state /data/state.json --state-interval 1 --preserve-historical-states; else exec anvil --host 0.0.0.0 --port 8545 --chain-id 20260922 --gas-limit 30000000 --mnemonic "$${ANVIL_MNEMONIC}" --dump-state /data/state.json --state-interval 1 --preserve-historical-states; fi'
    env_file:
      - ../../.env.web3.local
    volumes:
      - anvil-data:/data
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 3s
      timeout: 2s
      retries: 30

  rpc-gateway:
    image: node:22.19.0-alpine3.22
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["node", "/gateway/rpc-gateway.mjs"]
    environment:
      RPC_UPSTREAM: http://anvil:8545
      RPC_PORT: "8545"
      RPC_ALLOWED_ORIGINS: http://127.0.0.1:4174,http://localhost:4174,http://127.0.0.1:4000,http://localhost:4000
    volumes:
      - ./rpc-gateway.mjs:/gateway/rpc-gateway.mjs:ro
    ports:
      - "127.0.0.1:18545:8545"
    depends_on:
      anvil:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "--post-data={\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}",
          "http://127.0.0.1:8545"
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Run npm run web3:init}
      POSTGRES_DB: blockscout
    command: ["postgres", "-c", "max_connections=120"]
    volumes:
      - blockscout-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.5-alpine3.21
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - blockscout-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  smart-contract-verifier:
    image: ghcr.io/blockscout/smart-contract-verifier:v1.10.6
    # Solidity publishes the native compiler used by this verifier for amd64.
    # Docker Desktop/Colima emulates this one service on Apple Silicon so the
    # downloaded compiler and its x86-64 loader are in the same environment.
    platform: linux/amd64
    # A fresh named volume is root-owned. The verifier must be able to cache
    # downloaded Solidity compilers before it can verify contract sources.
    user: "0:0"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SMART_CONTRACT_VERIFIER__SERVER__HTTP__ENABLED: "true"
      SMART_CONTRACT_VERIFIER__SERVER__HTTP__ADDR: 0.0.0.0:8050
      SMART_CONTRACT_VERIFIER__SERVER__GRPC__ENABLED: "false"
      SMART_CONTRACT_VERIFIER__SOLIDITY__ENABLED: "true"
      SMART_CONTRACT_VERIFIER__SOLIDITY__COMPILERS_DIR: /data/solidity-compilers
      SMART_CONTRACT_VERIFIER__SOLIDITY__FETCHER__LIST__LIST_URL: https://binaries.soliditylang.org/linux-amd64/list.json
      SMART_CONTRACT_VERIFIER__VYPER__ENABLED: "false"
      SMART_CONTRACT_VERIFIER__SOURCIFY__ENABLED: "false"
      SMART_CONTRACT_VERIFIER__METRICS__ENABLED: "false"
      SMART_CONTRACT_VERIFIER__JAEGER__ENABLED: "false"
    volumes:
      - verifier-compilers:/data/solidity-compilers
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8050"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  blockscout:
    image: ghcr.io/blockscout/blockscout:9.0.2
    platform: ${DEYE_DOCKER_PLATFORM:-linux/arm64}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      [
        "sh",
        "-c",
        "bin/blockscout eval 'Elixir.Explorer.ReleaseTasks.create_and_migrate()' && bin/blockscout start"
      ]
    environment:
      DATABASE_URL: postgresql://blockscout:${LOCAL_DATABASE_PASSWORD:?Run npm run web3:init}@postgres:5432/blockscout?ssl=false
      ETHEREUM_JSONRPC_VARIANT: anvil
      ETHEREUM_JSONRPC_TRANSPORT: http
      ETHEREUM_JSONRPC_HTTP_URL: http://anvil:8545
      ETHEREUM_JSONRPC_TRACE_URL: http://anvil:8545
      CHAIN_ID: "20260922"
      NETWORK: Deye RWA Local
      SUBNETWORK: Revenue Rights Demo
      COIN: DETH
      COIN_NAME: Demo Ether
      PORT: "4000"
      SECRET_KEY_BASE: ${LOCAL_BLOCKSCOUT_SECRET:?Run npm run web3:init}
      DISABLE_MARKET: "true"
      DISABLE_FILE_LOGGING: "true"
      API_RATE_LIMIT_DISABLED: "true"
      INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "true"
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
      INDEXER_DISABLE_BLOCK_REWARD_FETCHER: "true"
      INDEXER_DISABLE_WITHDRAWALS_FETCHER: "true"
      MICROSERVICE_VISUALIZE_SOL2UML_ENABLED: "false"
      MICROSERVICE_SIG_PROVIDER_ENABLED: "false"
      MICROSERVICE_ACCOUNT_ABSTRACTION_ENABLED: "false"
      MICROSERVICE_SC_VERIFIER_ENABLED: "true"
      MICROSERVICE_SC_VERIFIER_URL: http://smart-contract-verifier:8050/
      MICROSERVICE_SC_VERIFIER_TYPE: sc_verifier
      ACCOUNT_ENABLED: "false"
      POOL_SIZE: "20"
      POOL_SIZE_API: "5"
    depends_on:
      anvil:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      smart-contract-verifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v2/stats"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  blockscout-frontend:
    image: ghcr.io/blockscout/frontend:v2.3.1
    platform: ${DEYE_DOCKER_PLATFORM:-linux/arm64}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NEXT_PUBLIC_APP_HOST: 127.0.0.1
      NEXT_PUBLIC_APP_PORT: "4000"
      NEXT_PUBLIC_APP_PROTOCOL: http
      NEXT_PUBLIC_API_HOST: 127.0.0.1
      NEXT_PUBLIC_API_PORT: "4000"
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_API_BASE_PATH: /
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ws
      NEXT_PUBLIC_NETWORK_NAME: Deye RWA Local
      NEXT_PUBLIC_NETWORK_SHORT_NAME: Deye RWA
      NEXT_PUBLIC_NETWORK_ID: "20260922"
      NEXT_PUBLIC_NETWORK_RPC_URL: http://127.0.0.1:18545
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: Demo Ether
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: DETH
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
      NEXT_PUBLIC_IS_TESTNET: "true"
      NEXT_PUBLIC_HOMEPAGE_CHARTS: "[]"
      NEXT_PUBLIC_HOMEPAGE_STATS: '["total_blocks","total_txs","wallet_addresses"]'
      NEXT_PUBLIC_HAS_BEACON_CHAIN: "false"
    depends_on:
      blockscout:
        condition: service_healthy

  explorer:
    image: nginx:1.29.1-alpine3.22
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./explorer-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      blockscout:
        condition: service_healthy
      blockscout-frontend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:4000/api/v2/stats >/dev/null && wget -qO- http://127.0.0.1:4000/ >/dev/null"
        ]
      interval: 10s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ../..
      dockerfile: infra/revenue-web3/app.Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ../../.env.web3.local
      - ../../.env.revenue
    environment:
      HARDHAT_NETWORK: revenue
      REVENUE_RPC_URL: http://anvil:8545
      REVENUE_CHAIN_ID: "20260922"
      REVENUE_PUBLIC_RPC_URL: http://127.0.0.1:18545
      REVENUE_EXPLORER_URL: http://127.0.0.1:4000
      REVENUE_EXPLORER_API_URL: http://explorer:4000
      REVENUE_BLOCKSCOUT_API_URL: http://explorer:4000/api
      REVENUE_BLOCKSCOUT_API_KEY: local-demo
      REVENUE_AUTO_VERIFY: "true"
      REVENUE_AUTO_SYNC_STATION_ID: ${REVENUE_AUTO_SYNC_STATION_ID:-}
      REVENUE_DATA_DIR: /data/revenue-web3
      REVENUE_HOST: 0.0.0.0
      REVENUE_PORT: "4174"
      REVENUE_ENV_FILE: /app/.env.revenue
    ports:
      - "127.0.0.1:4174:4174"
    volumes:
      - revenue-app-data:/data/revenue-web3
      - ../../.env.revenue:/app/.env.revenue:ro
    depends_on:
      anvil:
        condition: service_healthy
      explorer:
        condition: service_healthy

volumes:
  anvil-data:
  blockscout-db:
  blockscout-redis:
  verifier-compilers:
  revenue-app-data:
