<!doctype html><html lang="zh"><meta charset="utf-8"><title>Deye RWA · 演示导播</title><style>
*{box-sizing:border-box}body{margin:0;width:2560px;height:1440px;overflow:hidden;background:#091a25;color:#eef6f6;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{height:110px;padding:30px 52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2d4551}header strong{font-size:34px;letter-spacing:3px}header small{font-size:22px;color:#a5bdc7}#chapter{font-size:28px}main{height:1110px;padding:25px 40px;display:grid;grid-template-columns:1fr 460px;gap:26px}.screen{min-width:0;min-height:0;background:#fff;border:1px solid #324f5e;border-radius:14px;overflow:hidden;position:relative}.bar{height:58px;background:#183442;padding:12px 22px;color:#dfeeed;display:flex;align-items:center;justify-content:space-between;font-size:24px}.bar small{font-size:16px;color:#abc2ca}.screen>img{display:block;width:100%;height:calc(100% - 58px);object-fit:contain;background:#f2f5f8}.views{display:grid;grid-template-rows:1fr;gap:16px;min-height:0}aside{min-height:0;display:grid;grid-template-rows:repeat(3,1fr);gap:16px}aside .bar{height:38px;padding:7px 12px;font-size:17px}aside .bar small{font-size:13px}aside .screen>img{height:calc(100% - 38px)}aside .active{display:none}#wallet{display:none}#explorer{display:none}main.wallet .views{grid-template-columns:minmax(0,1fr) 640px}main.wallet #wallet{display:block}main.wallet #wallet img{object-fit:contain}main.chain{grid-template-columns:1fr}main.chain aside{display:none}main.chain .views{grid-template-columns:1fr 1fr}main.chain #explorer{display:block}footer{height:220px;padding:20px 52px;background:#102834;border-top:1px solid #365665}#instruction{font-size:25px;color:#9edecb;display:flex;justify-content:space-between}#caption{font-size:35px;line-height:1.65;text-align:center;margin:23px auto 0;max-width:2350px}#proof{font:18px ui-monospace,SFMono-Regular,monospace;color:#c4d6de;white-space:nowrap;overflow:hidden;margin-top:10px}#next{color:#c6d6dc}#time{font-size:16px;color:#b6c8cb}.capture{position:absolute;right:12px;bottom:10px;color:#fff;background:#163340d9;border-radius:5px;font-size:12px;padding:3px 6px}.screen:empty{background:#173d45}#controls{display:none}
</style><header><strong>DEYE <small>太阳能收益权 · 完整业务演示</small></strong><span id="chapter">准备录制</span><small>独立演示链 · 测试资金 · 真实 MetaMask</small></header><main id="stage"><div class="views"><section class="screen"><div class="bar"><b id="actor">业主</b><small id="address"></small></div><img id="main-image"></section><section class="screen" id="wallet"><div class="bar"><b>MetaMask · 本人确认</b></div><img id="wallet-image"></section><section class="screen" id="explorer"><div class="bar"><b>Blockscout · 链上凭证</b></div><img id="explorer-image"></section></div><aside id="roles"></aside></main><footer><div id="instruction"><span id="task"></span><span id="next"></span></div><div id="proof"></div><div id="caption"></div></footer><script>
const views=['owner','agent','investor','trustee'];const names={owner:'业主',agent:'中介机构',investor:'投资者',trustee:'受托管理人'};
roles.innerHTML=views.map(r=>`<section class="screen" data-role="${r}"><div class="bar"><b>${names[r]}</b><small data-address="${r}"></small></div><img data-image="${r}"><span class="capture" data-time="${r}">等待角色进入</span></section>`).join('');
window.setFrame=(key,data)=>{const r=key.replace(/2$/,'');const img=document.querySelector(`[data-image="${r}"]`);if(img){img.src=data;}if(window.active===key)document.getElementById('main-image').src=data;if(key==='wallet')document.getElementById('wallet-image').src=data;if(key==='explorer')document.getElementById('explorer-image').src=data;};
window.setScene=s=>{window.active=s.role;document.getElementById('actor').textContent=s.actor||names[s.role];document.getElementById('address').textContent=s.address||'';document.getElementById('chapter').textContent=s.chapter||'';document.getElementById('task').textContent=s.task||'';document.getElementById('next').textContent=s.next?'下一位：'+s.next:'';document.getElementById('caption').textContent=s.caption||'';document.getElementById('proof').textContent=s.proof||'';document.getElementById('stage').className=s.mode||'';const tile=document.querySelector(`[data-role="${s.role?.replace(/2$/,'')}"]`);if(tile){tile.querySelector('b').textContent=s.actor||names[s.role];tile.querySelector('small').textContent=s.address||'';tile.querySelector('.capture').textContent=s.task||'';}document.querySelectorAll('[data-role]').forEach(e=>e.classList.toggle('active',e.dataset.role===s.role?.replace(/2$/,'')));};
</script></html>
